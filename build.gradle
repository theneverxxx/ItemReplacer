plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def props = [
            version       : project.version.toString(),
            mc_dependency : project.mc_dependency.toString(),
            java_version  : project.java_version.toString(),
            loader_version: project.loader_version.toString()
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['fabric.mod.json', 'itemreplacer.mixins.json']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(project.java_version as int)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
}
